<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countback — Clinician Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0f1117; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 20px; background: #1a1d2e; border-bottom: 1px solid #2d3148; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: #a78bfa; }
    #status { font-size: 12px; color: #64748b; }
    #status.active { color: #4ade80; }
    #status.escalated { color: #f87171; }
    main { display: flex; flex: 1; overflow: hidden; }
    #transcript { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    .msg.agent { background: #1e293b; color: #94a3b8; align-self: flex-start; }
    .msg.patient { background: #1e3a5f; color: #bfdbfe; align-self: flex-end; }
    #sidebar { width: 280px; border-left: 1px solid #2d3148; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    #sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin-bottom: 4px; }
    .event { font-size: 11px; padding: 6px 8px; border-radius: 4px; background: #1a1d2e; border-left: 3px solid #4a5568; }
    .event.discrepancy { border-color: #f59e0b; }
    .event.coverage { border-color: #4ade80; }
    .event.escalation { border-color: #f87171; background: #2d1515; }
    .event.error { border-color: #f87171; }
    footer { padding: 12px 20px; background: #1a1d2e; border-top: 1px solid #2d3148; display: flex; gap: 8px; }
    button { padding: 8px 20px; border: none; border-radius: 6px; font-family: monospace; font-size: 13px; cursor: pointer; }
    #btn-call { background: #4ade80; color: #0f1117; }
    #btn-call.active { background: #f87171; }
    #btn-call:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>COUNTBACK</h1>
    <span id="status">disconnected</span>
  </header>
  <main>
    <div id="transcript"></div>
    <div id="sidebar">
      <h2>Events</h2>
      <div id="events"></div>
    </div>
  </main>
  <footer>
    <button id="btn-call">Start Call</button>
  </footer>

  <script>
    const PATIENT = "demo-patient-001"; // TODO: update after 9:30 broadcast

    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const eventsEl = document.getElementById("events");
    const btnCall = document.getElementById("btn-call");

    let callSocket = null;
    let consoleSocket = null;
    let mediaStream = null;
    let audioCtx = null;
    let processor = null;

    // Connect to event bus
    function connectConsole() {
      const ws = new WebSocket(`ws://${location.host}/console`);
      ws.onmessage = (e) => {
        const event = JSON.parse(e.data);
        handleBusEvent(event);
      };
      ws.onclose = () => setTimeout(connectConsole, 2000);
      consoleSocket = ws;
    }

    function handleBusEvent(event) {
      if (event.type === "transcript") {
        const div = document.createElement("div");
        div.className = `msg ${event.speaker}`;
        div.textContent = `[${event.speaker}] ${event.text}`;
        transcriptEl.appendChild(div);
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
        return;
      }

      const div = document.createElement("div");
      div.className = `event ${event.type}`;

      if (event.type === "call_started") {
        statusEl.textContent = "call active";
        statusEl.className = "active";
        div.textContent = "Call started";
      } else if (event.type === "call_ended") {
        statusEl.textContent = "call ended";
        statusEl.className = "";
        div.textContent = "Call ended";
      } else if (event.type === "discrepancy") {
        div.textContent = `Discrepancy: ${event.medication} — ${event.reason}`;
      } else if (event.type === "coverage_result") {
        div.textContent = `Coverage: ${event.medication} → copay ${event.copay}`;
      } else if (event.type === "escalation") {
        statusEl.textContent = "ESCALATED";
        statusEl.className = "escalated";
        div.textContent = `ESCALATION: "${event.trigger}"`;
      } else if (event.type === "tool_call") {
        div.textContent = `tool: ${event.tool}`;
      } else if (event.type === "error") {
        div.className = "event error";
        div.textContent = `Error: ${event.message}`;
      } else {
        div.textContent = JSON.stringify(event);
      }

      eventsEl.prepend(div);
    }

    // Start/stop call
    btnCall.addEventListener("click", async () => {
      if (callSocket) {
        stopCall();
      } else {
        await startCall();
      }
    });

    async function startCall() {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new AudioContext({ sampleRate: 16000 });
      const source = audioCtx.createMediaStreamSource(mediaStream);
      processor = audioCtx.createScriptProcessor(4096, 1, 1);

      callSocket = new WebSocket(`ws://${location.host}/call`);
      callSocket.binaryType = "arraybuffer";

      callSocket.onopen = () => {
        btnCall.textContent = "End Call";
        btnCall.classList.add("active");
      };

      // Stream mic audio to server as 16-bit PCM
      processor.onaudioprocess = (e) => {
        if (callSocket?.readyState !== WebSocket.OPEN) return;
        const float32 = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          int16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32768));
        }
        callSocket.send(int16.buffer);
      };

      source.connect(processor);
      processor.connect(audioCtx.destination);

      // Play Deepgram audio responses from server
      callSocket.onmessage = async (e) => {
        if (!(e.data instanceof ArrayBuffer)) return;
        const int16 = new Int16Array(e.data);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
        const buffer = audioCtx.createBuffer(1, float32.length, 16000);
        buffer.getChannelData(0).set(float32);
        const bufSource = audioCtx.createBufferSource();
        bufSource.buffer = buffer;
        bufSource.connect(audioCtx.destination);
        bufSource.start();
      };

      callSocket.onclose = () => stopCall();
    }

    function stopCall() {
      processor?.disconnect();
      audioCtx?.close();
      mediaStream?.getTracks().forEach((t) => t.stop());
      callSocket?.close();
      callSocket = null;
      btnCall.textContent = "Start Call";
      btnCall.classList.remove("active");
    }

    connectConsole();
  </script>
</body>
</html>
