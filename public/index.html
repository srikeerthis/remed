<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remed</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --bg: #f2f6f5; --panel: #ffffff; --line: #dde7e4; --card: #f7fbfa; --card-line: #e1ebe8;
        --text: #22332e; --dim: #6d827b; --accent: #4a9d8e; --warn: #c08a45; --danger: #c66d6d;
        background: var(--bg); color: var(--text);
      }
      * { box-sizing: border-box; }
      body { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }
      h1 { font-size: 28px; margin: 0; letter-spacing: -.01em; }
      h2 { font-size: 12px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
      h3 { margin: 0 0 4px; font-size: 15px; }
      .muted { color: var(--dim); }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
      .dot.live { background: var(--accent); box-shadow: 0 0 0 3px rgba(74,157,142,.18); }

      .callbar { margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
                 padding: 16px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
                 box-shadow: 0 1px 2px rgba(34,51,46,.04); }
      button { border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; background: var(--accent);
               color: #ffffff; font-weight: 700; font-size: 15px; }
      button:disabled { cursor: not-allowed; opacity: .4; }
      button.danger { background: var(--danger); color: #ffffff; }
      button.ghost { background: transparent; color: var(--dim); font-weight: 500; padding: 8px 10px; font-size: 12px; }
      button.ghost:hover { color: var(--text); }
      .callmeta { flex: 1; min-width: 160px; }
      #call-status { font-weight: 600; }
      .mic { display: flex; align-items: center; gap: 3px; height: 22px; }
      .mic i { width: 3px; background: var(--accent); border-radius: 2px; height: 4px; opacity: .35; }
      .mic.on i { animation: bounce .9s ease-in-out infinite; opacity: 1; }
      .mic.on i:nth-child(2){animation-delay:.1s} .mic.on i:nth-child(3){animation-delay:.2s}
      .mic.on i:nth-child(4){animation-delay:.3s} .mic.on i:nth-child(5){animation-delay:.4s}
      @keyframes bounce { 0%,100%{height:4px} 50%{height:20px} }

      #escalation { display: none; margin-top: 14px; background: #fdf2f1; border: 1px solid #eccfcd;
                    border-left: 4px solid var(--danger); border-radius: 10px; padding: 14px 16px; }
      #escalation.show { display: block; }
      #escalation strong { color: #a94f4f; }

      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 18px;
                box-shadow: 0 1px 2px rgba(34,51,46,.04); }

      #transcript { max-height: 420px; min-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
      .turn { max-width: 86%; padding: 10px 13px; border-radius: 12px; line-height: 1.45; }
      .turn.agent { background: #eef6f4; border: 1px solid #d8e8e3; align-self: flex-start; border-bottom-left-radius: 4px; }
      .turn.patient { background: #eef2f7; border: 1px solid #d9e2ec; align-self: flex-end; border-bottom-right-radius: 4px; }
      .turn .who { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin-bottom: 3px; }

      .medication { background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 12px 14px;
                    display: flex; align-items: flex-start; gap: 12px; transition: border-color .2s; }
      .medication + .medication { margin-top: 8px; }
      .medication .state { flex: none; font-size: 16px; width: 20px; text-align: center; color: var(--dim); }
      .medication.match { border-color: #a7d3ca; }
      .medication.match .state { color: var(--accent); }
      .medication.warn { border-color: #e3c99f; }
      .medication.warn .state { color: var(--warn); }
      .medication .body { flex: 1; min-width: 0; }
      .medication .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .medication .pills { display: flex; gap: 6px; flex-wrap: wrap; }
      .medication .pill { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: #eef4f2;
                           border: 1px solid var(--card-line); color: var(--dim); text-transform: uppercase;
                           letter-spacing: .06em; font-weight: 600; }
      .medication .pill.refills { background: #eaf5f2; border-color: #a7d3ca; color: #276151; }
      .medication .pill.renewal { background: #fbeee2; border-color: #e3c99f; color: #7a4d1f; }
      .medication .pill.sent    { background: #eaf5f2; border-color: #7bc0ac; color: #275e50; }
      .medication .pill.pa      { background: #fbeee2; border-color: #e3c99f; color: #7a4d1f; }
      .medication .pill.scenario{ background: #f2ecfa; border-color: #d7c8ee; color: #533f7a; }
      .medication .copay { margin-top: 10px; display: inline-flex; align-items: baseline; gap: 8px;
                           background: #eaf5f2; border: 1px solid #a7d3ca; padding: 6px 12px; border-radius: 8px; }
      .medication .copay b { font-size: 22px; font-weight: 750; color: var(--accent); letter-spacing: -.01em; }
      .medication .copay.warn { background: #fbeee2; border-color: #e3c99f; }
      .medication .copay.warn b { color: #7a4d1f; }
      .medication .copay.dim  { background: #eef2f0; border-color: var(--card-line); }
      .medication .copay.dim b { color: var(--text); font-size: 15px; font-weight: 650; }
      .medication .copay span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; }
      .medication .deductible { margin-top: 6px; font-size: 12px; color: var(--dim); }

      #careteam-section { display: none; }
      #careteam-section.show { display: block; }
      .careteam-item { padding: 10px 12px; border: 1px solid var(--card-line); background: var(--card); border-radius: 8px;
                       display: flex; flex-direction: column; gap: 3px; }
      .careteam-item + .careteam-item { margin-top: 8px; }
      .careteam-item .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); font-weight: 600; }
      .careteam-item .quote { font-style: italic; color: var(--text); }
      .careteam-item.severity-high { border-left: 3px solid var(--danger); }
      .careteam-item.severity-moderate { border-left: 3px solid var(--warn); }
      .careteam-item.severity-low { border-left: 3px solid var(--accent); }
      .empty { color: var(--dim); font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Remed</h1>
        <div class="muted" id="patient-name">Loading patient…</div>
      </div>
      <div class="status"><span class="dot" id="live-dot"></span><span id="status">connecting</span></div>
    </header>

    <div class="callbar">
      <button id="start-call">Start call</button>
      <button id="end-call" class="danger" style="display:none">End call</button>
      <div class="callmeta">
        <div id="call-status">Call not started.</div>
      </div>
      <div class="mic" id="mic"><i></i><i></i><i></i><i></i><i></i></div>
      <button id="new-review" class="ghost" title="Reset the conversation for a fresh take">Reset</button>
    </div>

    <div id="escalation">
      <strong>Urgent escalation triggered</strong>
      <div id="escalation-text" class="muted"></div>
    </div>

    <section>
      <h2>Transcript</h2>
      <div id="transcript"><div class="empty">Start the call and speak — the conversation appears here.</div></div>
    </section>

    <section>
      <h2>Medications</h2>
      <div id="medications"><div class="empty">Loading…</div></div>
    </section>

    <section id="careteam-section">
      <h2>For care team</h2>
      <div id="careteam"><div class="empty">Nothing flagged yet.</div></div>
    </section>

    <script>
      const $ = (selector) => document.querySelector(selector);
      const el = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      async function json(url, options) {
        const response = await fetch(url, { headers: { 'content-type': 'application/json' }, ...options });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      }

      let medications = [];

      async function loadPatient() {
        const [health, patient] = await Promise.all([json('/health'), json('/api/demo/patient')]);
        const voiceReady = health.adapters.voice === 'deepgram';
        $('#start-call').disabled = !voiceReady;
        $('#call-status').textContent = voiceReady
          ? 'Ready to start.'
          : 'Deepgram is not configured. Add DEEPGRAM_API_KEY to .env and restart.';
        $('#patient-name').textContent = patient.displayName;
        medications = patient.medications.map((m) => ({ ...m, state: 'pending', coverage: null }));
        renderMedications();
      }

      const STATE_META = {
        pending: { icon: '○', tone: '' },
        match: { icon: '✓', tone: 'match' },
        'not-taking': { icon: '⚠', tone: 'warn' },
        'different-label': { icon: '⚠', tone: 'warn' },
        'not-prescribed': { icon: '⚠', tone: 'warn' },
      };

      const SCENARIO_LABEL = {
        'covered': 'covered',
        'high-copay': 'high copay',
        'not-covered': 'not covered',
        'prior-auth-required': 'prior auth',
        'deductible-not-met': 'deductible',
        'payer-error': 'payer error',
      };

      function refillPill(m) {
        if (m.refillRequested) return el('span', 'pill sent', 'Refill sent');
        if (m.refillNeedsRenewal) return el('span', 'pill renewal', 'Needs renewal');
        if (typeof m.refillsRemaining === 'number') {
          const label = m.refillsRemaining === 0
            ? 'No refills'
            : `${m.refillsRemaining} refill${m.refillsRemaining === 1 ? '' : 's'}`;
          return el('span', 'pill refills', label);
        }
        return null;
      }

      function renderMedications() {
        if (!medications.length) {
          $('#medications').replaceChildren(el('div', 'empty', 'No medications on file.'));
          return;
        }
        $('#medications').replaceChildren(...medications.map((m) => {
          const meta = STATE_META[m.state] ?? STATE_META.pending;
          const row = el('div', `medication ${meta.tone}`);
          row.append(el('div', 'state', meta.icon));
          const body = el('div', 'body');

          const head = el('div', 'head');
          head.append(el('h3', null, m.display));
          const pills = el('div', 'pills');
          const rp = refillPill(m);
          if (rp) pills.append(rp);
          if (m.coverage?.priorAuthRequired) pills.append(el('span', 'pill pa', 'Prior auth'));
          if (m.coverage?.scenario && m.coverage.scenario !== 'covered') {
            pills.append(el('span', 'pill scenario', SCENARIO_LABEL[m.coverage.scenario] || m.coverage.scenario));
          }
          if (pills.children.length) head.append(pills);
          body.append(head);

          body.append(el('div', 'muted', m.instructions || 'No instructions recorded'));

          if (m.coverage) {
            const c = m.coverage;
            const status = c.formularyStatus;
            const tone = c.priorAuthRequired || status === 'non-formulary' || status === 'requires-prior-auth'
              ? 'warn'
              : (!c.copay ? 'dim' : '');
            const box = el('div', `copay${tone ? ' ' + tone : ''}`);
            let label;
            if (c.priorAuthRequired) label = 'PA required';
            else if (status === 'non-formulary') label = 'Not covered';
            else if (c.copay) label = c.copay;
            else if (c.deductibleRemaining) label = 'Full price';
            else label = '—';
            box.append(el('b', null, label));
            box.append(el('span', null, c.stubbed ? 'recorded' : 'live payer'));
            body.append(box);
            if (c.deductibleRemaining) {
              body.append(el('div', 'deductible', `${c.deductibleRemaining} left on deductible`));
            }
          }

          if (m.refillSpeakable) {
            body.append(el('div', 'muted', m.refillSpeakable));
          }

          row.append(body);
          return row;
        }));
      }

      function markMedication(name, kind, patch) {
        if (!name) return;
        const needle = String(name).toLowerCase();
        const hit = medications.find((m) => needle.includes(m.display.toLowerCase()));
        if (!hit) return;
        if (kind) hit.state = kind;
        if (patch) Object.assign(hit, patch);
        renderMedications();
      }

      let transcriptStarted = false;
      function addTurn(role, text) {
        if (!text) return;
        if (!transcriptStarted) { $('#transcript').replaceChildren(); transcriptStarted = true; }
        const turn = el('div', `turn ${role}`);
        turn.append(el('div', 'who', role === 'agent' ? 'Agent' : 'Patient'));
        turn.append(el('div', null, text));
        $('#transcript').append(turn);
        $('#transcript').scrollTop = $('#transcript').scrollHeight;
      }

      function escalate(text) {
        $('#escalation-text').textContent = text || 'The medication review stopped and a high-severity issue was written.';
        $('#escalation').classList.add('show');
      }

      let pendingCoverageFor = null;

      const CARETEAM_CATEGORIES = new Set(['side-effect', 'missed-dose', 'symptom', 'urgent', 'note', 'refill']);
      const CARETEAM_LABELS = {
        'side-effect': 'Side effect (patient-attributed)',
        'missed-dose': 'Missed dose',
        'symptom': 'Symptom',
        'urgent': 'Urgent',
        'refill': 'Refill / renewal',
        'note': 'Note for care team',
        'medication': 'Medication issue',
      };

      async function loadCareTeam() {
        try {
          const [issues, notes] = await Promise.all([json('/api/demo/issues'), json('/api/demo/care-team-notes')]);
          const items = [
            ...issues
              .filter((i) => CARETEAM_CATEGORIES.has(i.category))
              .map((i) => ({
                id: `i-${i.id}`,
                kind: CARETEAM_LABELS[i.category] || i.category,
                summary: i.summary,
                patientWords: i.patientWords,
                severity: i.severity,
                createdAt: i.createdAt,
              })),
            ...notes.map((n) => ({
              id: `n-${n.id}`,
              kind: `Note — ${n.topic}`,
              summary: '',
              patientWords: n.patientWords,
              severity: 'low',
              createdAt: n.createdAt,
            })),
          ].sort((a, b) => (b.createdAt ?? '').localeCompare(a.createdAt ?? ''));

          const section = $('#careteam-section');
          const target = $('#careteam');
          if (!items.length) {
            section.classList.remove('show');
            target.replaceChildren(el('div', 'empty', 'Nothing flagged yet.'));
            return;
          }
          section.classList.add('show');
          target.replaceChildren(...items.map((i) => {
            const row = el('div', `careteam-item severity-${i.severity ?? 'low'}`);
            row.append(el('div', 'kind', i.kind));
            if (i.summary) row.append(el('div', null, i.summary));
            if (i.patientWords) row.append(el('div', 'quote', `“${i.patientWords}”`));
            return row;
          }));
        } catch { /* ignore — no server or offline */ }
      }

      function handleEvent(event) {
        const d = event.data ?? {};
        switch (event.type) {
          case 'transcript':
            addTurn(d.role, d.text);
            return;
          case 'reconciliation.result':
            markMedication(d.medication, d.kind);
            return;
          case 'coverage.check.request':
            pendingCoverageFor = d.medicationName ?? d.medication ?? null;
            return;
          case 'coverage.result':
          case 'coverage.check.response': {
            const medication = d.medication ?? d.medicationName ?? pendingCoverageFor;
            const coverage = {
              copay: d.copay ?? null,
              deductibleRemaining: d.deductibleRemaining ?? null,
              priorAuthRequired: Boolean(d.priorAuthRequired),
              formularyStatus: d.formularyStatus ?? null,
              scenario: d.scenario ?? null,
              stubbed: Boolean(d.stubbed),
            };
            markMedication(medication, undefined, { coverage });
            return;
          }
          case 'refill.requested': {
            markMedication(d.medication, undefined, {
              refillsRemaining: d.refillsRemaining,
              refillNeedsRenewal: Boolean(d.needsRenewal),
              refillRequested: !d.needsRenewal,
              refillSpeakable: d.needsRenewal ? 'Renewal requested from prescriber.' : 'Refill sent to pharmacy.',
            });
            loadCareTeam();
            return;
          }
          case 'care-team-note.recorded':
          case 'missed-dose.recorded':
          case 'side-effect.recorded':
          case 'demo.care-team-note.created':
          case 'demo.detected-issue.created':
          case 'medplum.create.response':
            loadCareTeam();
            return;
          case 'escalation.detected':
            escalate(`Trigger phrase: “${d.trigger}”`);
            loadCareTeam();
            return;
          case 'escalation.triggered':
            escalate(d.patientWords ? `Patient said: “${d.patientWords}”` : '');
            loadCareTeam();
            return;
          default:
            return;
        }
      }

      let eventSocket = null;
      let reconnectTimer = null;
      function connectEvents() {
        clearTimeout(reconnectTimer);
        eventSocket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/events`);
        eventSocket.addEventListener('open', () => {
          $('#status').textContent = 'live';
          $('#live-dot').classList.add('live');
        });
        eventSocket.addEventListener('message', ({ data }) => {
          const event = JSON.parse(data);
          try { handleEvent(event); } catch (error) { console.error('render failed', error); }
        });
        eventSocket.addEventListener('close', () => {
          $('#status').textContent = 'reconnecting…';
          $('#live-dot').classList.remove('live');
          reconnectTimer = setTimeout(connectEvents, 1000);
        });
      }

      $('#new-review').addEventListener('click', async () => {
        try { await json('/api/demo/memory/reset', { method: 'POST' }); } catch {}
        transcriptStarted = false;
        $('#transcript').replaceChildren(el('div', 'empty', 'Start the call and speak — the conversation appears here.'));
        $('#escalation').classList.remove('show');
        medications = medications.map((m) => ({
          ...m, state: 'pending', coverage: null,
          refillRequested: false, refillNeedsRenewal: false, refillSpeakable: null,
        }));
        renderMedications();
        loadCareTeam();
      });

      connectEvents();
      loadPatient().catch((error) => { $('#call-status').textContent = error.message; });
      loadCareTeam();

      let callWs = null, micStream = null, audioCtx = null, playCtx = null;
      let micSource = null, micProcessor = null, silentGain = null;
      let nextPlayTime = 0;

      const pcmProcessorSrc = `
        class PCMProcessor extends AudioWorkletProcessor {
          process(inputs) {
            const ch = inputs[0]?.[0];
            if (ch) {
              const out = new Int16Array(ch.length);
              for (let i = 0; i < ch.length; i++)
                out[i] = Math.max(-32768, Math.min(32767, ch[i] * 32767 | 0));
              this.port.postMessage(out.buffer, [out.buffer]);
            }
            return true;
          }
        }
        registerProcessor('pcm-processor', PCMProcessor);
      `;

      async function startCall() {
        $('#start-call').disabled = true;
        try {
          const health = await json('/health');
          if (health.adapters.voice !== 'deepgram') {
            throw new Error('Deepgram is not configured. Add DEEPGRAM_API_KEY to .env and restart.');
          }
          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('Microphone access is unavailable. Open the app on localhost or HTTPS.');
          }
          $('#call-status').textContent = 'Allow microphone access to begin…';
          micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
          audioCtx = new AudioContext({ sampleRate: 16000 });
          playCtx = new AudioContext({ sampleRate: 16000 });
          await Promise.all([audioCtx.resume(), playCtx.resume()]);
          const blob = new Blob([pcmProcessorSrc], { type: 'application/javascript' });
          const url = URL.createObjectURL(blob);
          try { await audioCtx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
          micSource = audioCtx.createMediaStreamSource(micStream);
          micProcessor = new AudioWorkletNode(audioCtx, 'pcm-processor');
          silentGain = audioCtx.createGain();
          silentGain.gain.value = 0;
          micSource.connect(micProcessor);
          micProcessor.connect(silentGain);
          silentGain.connect(audioCtx.destination);
          const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/call`;
          callWs = new WebSocket(wsUrl);
          callWs.binaryType = 'arraybuffer';
          nextPlayTime = 0;
        } catch (error) {
          stopCall();
          $('#call-status').textContent = `Unable to start call: ${error.message}`;
          return;
        }

        callWs.addEventListener('message', (e) => {
          if (typeof e.data === 'string') {
            const message = JSON.parse(e.data);
            if (message.type === 'ready') {
              micProcessor.port.onmessage = (event) => {
                if (callWs?.readyState === WebSocket.OPEN) callWs.send(event.data);
              };
              $('#call-status').textContent = 'Live — speak now.';
              $('#mic').classList.add('on');
            }
            return;
          }
          if (!(e.data instanceof ArrayBuffer) || !e.data.byteLength) return;
          const int16 = new Int16Array(e.data);
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
          const buf = playCtx.createBuffer(1, float32.length, 16000);
          buf.copyToChannel(float32, 0);
          const src = playCtx.createBufferSource();
          src.buffer = buf;
          src.connect(playCtx.destination);
          const now = playCtx.currentTime;
          const t = Math.max(now + 0.05, nextPlayTime);
          src.start(t);
          nextPlayTime = t + buf.duration;
        });

        callWs.addEventListener('open', () => {
          $('#call-status').textContent = 'Connecting…';
          $('#start-call').style.display = 'none';
          $('#end-call').style.display = '';
        });
        callWs.addEventListener('close', (event) => {
          $('#call-status').textContent = event.reason || 'Call ended.';
          resetCallUI();
        });
        callWs.addEventListener('error', () => { $('#call-status').textContent = 'Connection error.'; resetCallUI(); });
      }

      function stopCall() {
        callWs?.close();
        micStream?.getTracks().forEach((t) => t.stop());
        audioCtx?.close();
        playCtx?.close();
        micSource?.disconnect();
        micProcessor?.disconnect();
        silentGain?.disconnect();
        callWs = null; micStream = null; audioCtx = null; playCtx = null;
        micSource = null; micProcessor = null; silentGain = null;
        resetCallUI();
      }

      function resetCallUI() {
        $('#start-call').disabled = false;
        $('#start-call').style.display = '';
        $('#end-call').style.display = 'none';
        $('#mic').classList.remove('on');
      }

      $('#start-call').addEventListener('click', startCall);
      $('#end-call').addEventListener('click', stopCall);
    </script>
  </body>
</html>
