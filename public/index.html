<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countback clinical console</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07100d; color: #e8f0ec; }
      * { box-sizing: border-box; }
      body { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
      header, .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      h1 { font-size: 28px; margin: 0; } h2 { font-size: 17px; margin: 0 0 16px; } h3 { margin: 0 0 6px; font-size: 15px; }
      .muted, time { color: #8fa69a; } #status { color: #f0bd68; }
      .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; margin-top: 22px; }
      .stack { display: grid; gap: 18px; }
      section { background: #0d1914; border: 1px solid #20372c; border-radius: 14px; padding: 18px; }
      .medication, .issue, .event { background: #11211a; border: 1px solid #294638; border-radius: 9px; padding: 12px; }
      .medication + .medication, .issue + .issue, .event + .event { margin-top: 8px; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      button { border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; background: #4ad295; color: #04140d; font-weight: 700; }
      button.secondary { background: #233d31; color: #dcebe3; } button.danger { background: #f07178; color: #210507; }
      textarea { width: 100%; min-height: 70px; resize: vertical; border: 1px solid #365746; background: #08120e; color: #e8f0ec; border-radius: 8px; padding: 10px; }
      .badge { display: inline-block; border-radius: 999px; padding: 3px 8px; background: #244334; font-size: 12px; }
      .high { background: #682e34; } .moderate { background: #634d24; }
      #events { max-height: 330px; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; color: #aebfb6; }
      #result { min-height: 22px; color: #75dfac; font-weight: 650; }
      @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Countback</h1><div class="muted">Medication reconciliation · clinician review</div></div>
      <div><span id="mode" class="badge">loading</span> <span id="status">connecting</span></div>
    </header>

    <div class="grid">
      <div class="stack">
        <section>
          <h2 id="patient-name">Synthetic patient</h2>
          <div id="medications"></div>
        </section>

        <section>
          <h2>Demo the reconciliation</h2>
          <div class="controls">
            <button data-scenario="match">Matching bottle</button>
            <button class="secondary" data-scenario="dose">Wrong frequency</button>
            <button class="secondary" data-scenario="cost">Stopped because of cost</button>
            <button class="secondary" data-scenario="extra">Not prescribed</button>
          </div>
          <div id="result">Choose a scenario.</div>
        </section>

        <section>
          <h2>Patient words → clinician</h2>
          <textarea id="patient-words">I have felt dizzy since I came home.</textarea>
          <div class="controls">
            <button id="symptom">Record verbatim</button>
            <button id="urgent" class="danger">Urgent escalation demo</button>
          </div>
          <div class="muted">No symptom assessment or medication advice is generated.</div>
        </section>
      </div>

      <div class="stack">
        <section>
          <div class="row"><h2>Flagged for clinician review</h2><button id="refresh" class="secondary">Refresh</button></div>
          <div id="issues"><div class="muted">No issues yet.</div></div>
        </section>
        <section>
          <h2>Integration event log</h2>
          <div id="events"></div>
        </section>
      </div>
    </div>

    <script>
      const $ = (selector) => document.querySelector(selector);
      const scenarios = {
        match: { labelText: 'Metformin 500 mg twice daily', patientWords: 'My bottle says Metformin 500 milligrams, take it twice a day.', taking: true },
        dose: { labelText: 'Metformin 500 mg once daily', patientWords: 'My bottle says Metformin 500 milligrams once a day.', taking: true },
        cost: { labelText: 'Lisinopril 10 mg once daily', patientWords: 'I stopped taking Lisinopril because it costs too much.', taking: false, stoppedReason: 'cost' },
        extra: { labelText: 'Demo medicine not on discharge list 20 mg daily', patientWords: 'I am also taking this other bottle every day.', taking: true },
      };

      async function json(url, options) {
        const response = await fetch(url, { headers: { 'content-type': 'application/json' }, ...options });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      }

      async function loadPatient() {
        const [health, patient] = await Promise.all([json('/health'), json('/api/demo/patient')]);
        $('#mode').textContent = `clinical: ${health.adapters.clinical}`;
        $('#patient-name').textContent = patient.displayName;
        $('#medications').replaceChildren(...patient.medications.map((medication) => {
          const row = document.createElement('div'); row.className = 'medication';
          row.innerHTML = `<h3></h3><div class="muted"></div>`;
          row.querySelector('h3').textContent = medication.display;
          row.querySelector('div').textContent = medication.instructions || 'No instructions recorded';
          return row;
        }));
      }

      async function loadIssues() {
        const issues = await json('/api/demo/issues');
        if (!issues.length) { $('#issues').innerHTML = '<div class="muted">No issues yet.</div>'; return; }
        $('#issues').replaceChildren(...issues.map((issue) => {
          const row = document.createElement('div'); row.className = 'issue';
          const title = document.createElement('h3'); title.textContent = issue.summary;
          const badge = document.createElement('span'); badge.className = `badge ${issue.severity}`; badge.textContent = issue.severity;
          const words = document.createElement('div'); words.textContent = `“${issue.patientWords}”`;
          const time = document.createElement('time'); time.textContent = new Date(issue.createdAt).toLocaleTimeString();
          row.append(title, badge, words, time); return row;
        }));
      }

      document.querySelectorAll('[data-scenario]').forEach((button) => button.addEventListener('click', async () => {
        try {
          const result = await json('/api/demo/reconcile', { method: 'POST', body: JSON.stringify(scenarios[button.dataset.scenario]) });
          $('#result').textContent = result.kind === 'match' ? 'Match — no issue created.' : `${result.kind} — clinician issue created${result.shouldCheckCoverage ? '; voice should call insurance next.' : '.'}`;
          await loadIssues();
        } catch (error) { $('#result').textContent = error.message; }
      }));

      async function recordSymptom(urgent) {
        const patientWords = $('#patient-words').value.trim();
        if (!patientWords) return;
        const result = await json('/api/demo/symptom', { method: 'POST', body: JSON.stringify({ patientWords, urgent }) });
        $('#result').textContent = urgent ? result.spokenResponse : 'Patient words recorded verbatim for clinician review.';
        await loadIssues();
      }
      $('#symptom').addEventListener('click', () => recordSymptom(false));
      $('#urgent').addEventListener('click', () => recordSymptom(true));
      $('#refresh').addEventListener('click', loadIssues);

      const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/events`);
      socket.addEventListener('open', () => { $('#status').textContent = 'live'; $('#status').style.color = '#72d5a5'; });
      socket.addEventListener('close', () => { $('#status').textContent = 'disconnected'; $('#status').style.color = '#ef7b7b'; });
      socket.addEventListener('message', ({ data }) => {
        const event = JSON.parse(data); const row = document.createElement('div'); row.className = 'event';
        const time = document.createElement('time'); time.textContent = new Date(event.at).toLocaleTimeString();
        const type = document.createElement('strong'); type.textContent = `${event.source} · ${event.type}`;
        row.append(time, type);
        if (event.data !== undefined) { const details = document.createElement('pre'); details.textContent = JSON.stringify(event.data, null, 2); row.append(details); }
        $('#events').prepend(row);
      });

      Promise.all([loadPatient(), loadIssues()]).catch((error) => { $('#result').textContent = error.message; });
    </script>
  </body>
</html>
